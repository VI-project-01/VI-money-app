<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance App Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- Import Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="text-center mb-4">📊 Laporan Keuangan Cloud</h2>
    
    <!-- Bagian Ringkasan (Sama seperti sebelumnya) -->
    <div class="row mb-4 text-center">
        <div class="col-md-4"><div class="card p-3"><h6>Aset</h6><p id="totalAset" class="h4 text-success">Rp 0</p></div></div>
        <div class="col-md-4"><div class="card p-3"><h6>Hutang</h6><p id="totalLiabilitas" class="h4 text-danger">Rp 0</p></div></div>
        <div class="col-md-4"><div class="card p-3 border-primary"><h6>Harta Real</h6><p id="hartaReal" class="h4 text-primary">Rp 0</p></div></div>
    </div>

    <!-- Form -->
    <div class="card p-4 mb-4">
        <form id="financeForm" class="row g-3">
            <div class="col-md-2"><select id="type" class="form-select"><option value="aset">Aset</option><option value="liabilitas">Hutang</option></select></div>
            <div class="col-md-3"><input type="text" id="name" class="form-control" placeholder="Nama Transaksi" required></div>
            <div class="col-md-2"><input type="number" id="amount" class="form-control" placeholder="Jumlah" required></div>
            <div class="col-md-3"><input type="text" id="note" class="form-control" placeholder="Catatan"></div>
            <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Simpan</button></div>
        </form>
    </div>

    <!-- Tabel -->
    <div class="card p-4">
        <div class="d-flex justify-content-between mb-3">
            <h5>Daftar Transaksi (Cloud)</h5>
            <button onclick="exportToExcel()" class="btn btn-outline-success btn-sm">Ekspor Excel</button>
        </div>
        <table class="table">
            <thead><tr><th>Tanggal</th><th>Jenis</th><th>Nama</th><th>Jumlah</th><th>Aksi</th></tr></thead>
            <tbody id="transactionList"></tbody>
        </table>
    </div>
</div>

<script>

    // 1. TAMBAHKAN KODE INI DI BARIS PALING ATAS SCRIPT
    const password = prompt("Masukkan Password:");
    if (password !== "iamvi") {
        alert("Akses ditolak!");
        document.body.innerHTML = "<h1>Akses Dilarang</h1>";
    }

    
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = https://xitndmmppbvroqplifgx.supabase.co/rest/v1/;
    const SUPABASE_KEY = sb_publishable_KcLuINeg8MC23Q41mzkFtA_xYMfxE-V;
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('financeForm');

    // Load data dari Database saat web dibuka
    async function loadData() {
        const { data, error } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });
        if (error) console.log(error);
        else renderUI(data);
    }

    function renderUI(transactions) {
        const list = document.getElementById('transactionList');
        list.innerHTML = '';
        let aset = 0, hutang = 0;

        transactions.forEach(t => {
            if(t.type === 'aset') aset += t.amount; else hutang += t.amount;
            list.innerHTML += `
                <tr>
                    <td>${t.date}</td>
                    <td><span class="badge ${t.type === 'aset' ? 'bg-success' : 'bg-danger'}">${t.type}</span></td>
                    <td>${t.name} <br><small class="text-muted">${t.note}</small></td>
                    <td>Rp ${t.amount.toLocaleString()}</td>
                    <td><button onclick="deleteData(${t.id})" class="btn btn-sm text-danger">Hapus</button></td>
                </tr>`;
        });

        document.getElementById('totalAset').innerText = "Rp " + aset.toLocaleString();
        document.getElementById('totalLiabilitas').innerText = "Rp " + hutang.toLocaleString();
        document.getElementById('hartaReal').innerText = "Rp " + (aset - hutang).toLocaleString();
        window.currentData = transactions; // Untuk keperluan excel
    }

    // Simpan ke Database
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            type: document.getElementById('type').value,
            name: document.getElementById('name').value,
            amount: parseFloat(document.getElementById('amount').value),
            note: document.getElementById('note').value,
            date: new Date().toLocaleDateString('id-ID')
        };

        const { error } = await supabase.from('transactions').insert([payload]);
        if (error) alert("Gagal menyimpan!");
        else { form.reset(); loadData(); }
    });

    // Hapus dari Database
    async function deleteData(id) {
        if(confirm('Hapus?')) {
            await supabase.from('transactions').delete().eq('id', id);
            loadData();
        }
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(window.currentData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Laporan");
        XLSX.writeFile(wb, "Laporan_Keuangan.xlsx");
    }

    loadData();
</script>
</body>
</html>
